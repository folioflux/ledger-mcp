name: Feature request
description: Suggest a small, generic improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project is deliberately small and generic. Requests that keep it simple and broadly useful are the most likely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
